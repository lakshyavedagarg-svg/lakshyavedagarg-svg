name: Generate dust heatmap

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/dust_heatmap.py"
      - ".github/workflows/dust-heatmap.yml"

permissions:
  contents: write

concurrency:
  group: dust-heatmap
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build animated contribution heatmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/dust_heatmap.py --username lakshyavedagarg-svg

      - name: Commit refreshed heatmap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/dust-heatmap.svg
          git diff --cached --quiet || git commit -m "chore: refresh dust heatmap"
          git push
